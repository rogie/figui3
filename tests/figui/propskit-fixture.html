<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PropsKit Isolation Fixture</title>
    <link rel="stylesheet" href="/dist/propskit.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }

      #host-chrome {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        align-items: center;
      }

      #panel-root {
        width: 260px;
      }
    </style>
  </head>
  <body>
    <div id="host-chrome">
      <button type="button" id="host-button">Host button</button>
      <input type="text" id="host-input" value="Host input" />
    </div>
    <div id="panel-root" class="figui-root" theme="system"></div>
    <script type="module">
      import {
        createPropsKit,
        applyFiguiTheme,
      } from "/propskit.js";
      window.createPropsKit = createPropsKit;
      window.applyFiguiTheme = applyFiguiTheme;
      window.__propskitReady = true;
    </script>
  </body>
</html>
